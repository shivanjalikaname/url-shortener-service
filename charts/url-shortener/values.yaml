replicaCount: 2

image:
  repository: ghcr.io/shivanjalikaname/url-shortener-service
  # Defaults to the chart appVersion; CI overrides with the commit SHA tag
  tag: ""
  pullPolicy: IfNotPresent

env:
  BASE_URL: https://sho.rt
  CODE_LENGTH: "7"

service:
  type: ClusterIP
  port: 80

ingress:
  enabled: false
  className: nginx
  host: sho.rt
  tlsSecretName: ""

resources:
  requests:
    cpu: 50m
    memory: 96Mi
  limits:
    memory: 192Mi

autoscaling:
  enabled: true
  minReplicas: 2
  maxReplicas: 6
  targetCPUUtilizationPercentage: 70

podDisruptionBudget:
  minAvailable: 1

# Adds prometheus.io/* annotations for annotation-based scraping
metrics:
  scrape: true
